server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /admin {
    return 308 /admin/$is_args$args;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  # Preserve the original public URLs for the ten newspaper editions.
  location ~ ^/(?<edition>elle|vogue|chosun|donga|kyunghyang|time|newyorker|atlantic|natgeo|wired)/?$ {
    try_files /editions/$edition.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 피에조 충격 실시간 알림(SSE): 버퍼링 없이 바로 흘려보내고 오래 열어 둔다.
  location = /api/events {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # API image URLs also end in .jpg. This prefix must win over the static-file
  # regex below so Meta can fetch /api/publish-images/*.jpg from ai-worker.
  location ^~ /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    client_max_body_size 10m;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
}
