server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 사진(관찰)·대화(전사) → h.joun.cc. h.joun.cc가 n.joun.cc 출처를 CORS로 허용하지 않아 같은 서버 경로로 받아서 넘겨준다.
  location ~ ^/api/(observations|transcripts)$ {
    client_max_body_size 10m;
    proxy_pass https://h.joun.cc;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host h.joun.cc;
    proxy_set_header Origin "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 피에조 충격 실시간 알림(SSE): 버퍼링 없이 바로 흘려보내고 오래 열어 둔다.
  location = /api/events {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
}
