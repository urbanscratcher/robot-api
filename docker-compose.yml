services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: robot-face-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - proxy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: robot-face-backend
    environment:
      PORT: 3000
      # 설정하면 ESP32가 POST /api/hurt 할 때 Authorization: Bearer <토큰> 이 필요하다.
      HURT_TOKEN: ${HURT_TOKEN:-}
      # 로봇 주행 켜짐/꺼짐을 저장하는 파일 (다시 배포해도 유지되도록 볼륨에 둔다)
      ROBOT_STATE_FILE: /app/data/robot-state.json
    volumes:
      - /mnt/data/cam:/app/data
    restart: unless-stopped

networks:
  proxy:
    external: true
